<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; padding: 0; background: url('https://placehold.co/600x800/EEE/31343C'); background-size: cover; height: 100vh;}
.modal-backdrop {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.modal-content {
  background: white;
  width: 100%;
  border-radius: 20px 20px 0 0;
  padding: 0; /* Changed padding to 0 like some modals to see if it makes sense, wait AddItemModal has padding 16px */
  max-height: 90vh;
  display: flex;
  flex-direction: column;
}
.search-step-container {
  flex: 1; display: flex; flex-direction: column; min-height: 0;
}
.scanner-container {
  position: relative;
  width: 100%;
  height: 60vh;
  min-height: 400px;
  background-color: #000;
  border-radius: 20px 20px 0 0;
  display: flex;
  flex-direction: column;
}
</style>
</head>
<body>
<div class="modal-backdrop">
  <div class="modal-content" style="padding: 16px;">
    <div class="search-step-container">
      <div class="scanner-container">
        <!-- absolute elements here -->
        <div style="position: absolute; top: 10px; right: 10px; color: white;">X</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
